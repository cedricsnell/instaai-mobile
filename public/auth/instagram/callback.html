<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Instagram Auth Callback</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Connecting Instagram Account...</h2>
        <div class="spinner"></div>
        <p>Please wait while we complete the connection.</p>
    </div>

    <script>
        // This page receives the OAuth callback from Instagram
        // expo-web-browser will automatically close this window and return the result
        // to the main app

        // Log for debugging
        console.log('Instagram OAuth callback received');
        console.log('URL:', window.location.href);

        // The expo-web-browser library handles the rest automatically
        // It will detect the URL change and close this popup
    </script>
</body>
</html>
